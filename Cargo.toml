[package]
name = "VideoEncoder"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = { version = "1.19.0", features = ["backend-winit", "raw-window-handle-06"] }
rfd = "0.18.0"
tokio = { version = "1.54.1", features = ["full"] }
anyhow = "1.0.104"
which = "8.0.6"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Ole", "Win32_Storage_FileSystem"] }
windows = { version = "0.62.2", default-features = false, features = ["Win32_System_Com", "Win32_UI_Shell"] }
raw-window-handle = "0.6.2"
image = { version = "0.25.10", features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[build-dependencies]
slint-build = "1.19.0"
winres = "0.1.12"
image = { version = "0.25.10", features = ["ico", "png"] }

[profile.release]
opt-level = "z"      # 크기 최적화 (s 또는 z)
lto = true           # Link Time Optimization: 미사용 코드 제거
codegen-units = 1    # 병렬 컴파일을 제한하여 최적화 기회 극대화
panic = "abort"      # 패닉 발생 시 스택 추적 정보 제거
strip = true         # 심볼 정보 및 디버그 정보 강제 제거
